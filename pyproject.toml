[project]
name = "devis-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julien", email = "julien.mulac@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
devis-extractor = "devis_extractor:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
]
